<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Artisan Connect - Home Dashboard</title>
<!-- Material Symbols -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&amp;family=Manrope:wght@100..900&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Tailwind Config from Style Guidance -->
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "primary": "#1A237E",
                    "background": "#FFF8EE",
                    "surface": "#ffffff",
                    "on-surface": "#1A237E",
                    "madder-red": "#B71C1C",
                    "on-madder-red": "#ffffff",
                    "on-primary-fixed": "#3c0800",
                    "tertiary": "#833828",
                    "on-primary": "#ffffff",
                    "primary-fixed": "#ffdad2",
                    "on-background": "#241914",
                    "on-error-container": "#93000a",
                    "on-tertiary-fixed-variant": "#783020",
                    "inverse-on-surface": "#ffede7",
                    "on-tertiary-fixed": "#3e0500",
                    "tertiary-fixed": "#ffdad3",
                    "inverse-primary": "#ffb4a2",
                    "surface-container-lowest": "#ffffff",
                    "on-primary-fixed-variant": "#7e2b16",
                    "secondary-fixed": "#ffdeae",
                    "tertiary-fixed-dim": "#ffb4a4",
                    "error": "#ba1a1a",
                    "on-tertiary": "#ffffff",
                    "surface-container-low": "#fff1ec",
                    "primary-fixed-dim": "#ffb4a2",
                    "primary-container": "#a84a32",
                    "on-secondary-container": "#724d00",
                    "inverse-surface": "#3b2e28",
                    "surface-container": "#ffe9e2",
                    "surface-container-high": "#fae4db",
                    "outline-variant": "#dcc0ba",
                    "on-surface-variant": "#1A237E",
                    "surface-container-highest": "#f4ded6",
                    "on-secondary-fixed": "#281800",
                    "on-secondary": "#ffffff",
                    "outline": "#89726c",
                    "surface-tint": "#9d422b",
                    "tertiary-container": "#a14f3d",
                    "surface-bright": "#fff8f6",
                    "error-container": "#ffdad6",
                    "on-tertiary-container": "#ffdfd9",
                    "surface-variant": "#f4ded6",
                    "secondary": "#7f5600",
                    "on-primary-container": "#ffdfd7",
                    "secondary-fixed-dim": "#fcbb4c",
                    "on-error": "#ffffff",
                    "surface-dim": "#ebd6cd",
                    "on-secondary-fixed-variant": "#604100",
                    "secondary-container": "#ffbe4f"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "2xl": "20px",
                    "full": "9999px"
            },
            "spacing": {
                    "margin-desktop": "40px",
                    "gutter": "24px",
                    "margin-mobile": "16px",
                    "container-max": "1280px",
                    "touch-target-min": "48px",
                    "unit": "8px"
            },
            "fontFamily": {
                    "label-sm": ["Inter"],
                    "body-lg": ["Inter"],
                    "headline-md": ["Manrope"],
                    "headline-lg": ["Manrope"],
                    "display-lg": ["Manrope"],
                    "body-md": ["Inter"],
                    "label-lg": ["Inter"],
                    "headline-lg-mobile": ["Manrope"]
            },
            "fontSize": {
                    "label-sm": ["12px", {"lineHeight": "16px", "fontWeight": "500"}],
                    "body-lg": ["18px", {"lineHeight": "28px", "fontWeight": "400"}],
                    "headline-md": ["24px", {"lineHeight": "32px", "fontWeight": "600"}],
                    "headline-lg": ["32px", {"lineHeight": "40px", "fontWeight": "700"}],
                    "display-lg": ["48px", {"lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                    "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                    "label-lg": ["18px", {"lineHeight": "24px", "letterSpacing": "0.01em", "fontWeight": "600"}],
                    "headline-lg-mobile": ["28px", {"lineHeight": "36px", "fontWeight": "700"}]
            }
          }
        }
      }
    </script>
<style>
        .material-symbols-outlined {
          font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .filled-icon {
          font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="bg-background text-on-surface font-body-md antialiased min-h-screen flex flex-col">
<!-- TopAppBar -->
<header class="flex justify-between items-center w-full px-margin-mobile md:px-margin-desktop py-4 bg-background docked full-width top-0 z-40 sticky">
<div class="font-headline-md text-headline-md font-bold text-primary">Artisan Connect</div>
<div class="flex items-center gap-4">
<button aria-label="Notifications" class="w-12 h-12 flex items-center justify-center rounded-full hover:bg-black/5 transition-colors">
<span class="material-symbols-outlined text-primary text-[28px]">notifications</span>
</button>
<button class="hover:opacity-80 transition-opacity">
<img alt="User Profile Avatar" class="w-10 h-10 rounded-full object-cover border border-primary/20" data-alt="A close-up portrait of an Indian woman, a master weaver, in her mid-40s with a warm, welcoming smile. She is wearing a simple, elegant earthy-toned sari. The lighting is soft, natural, and flattering, reflecting a high-end, authentic lifestyle photography style suitable for a premium marketplace profile picture. The background is slightly blurred but suggests a bright, organized workshop." src="https://lh3.googleusercontent.com/aida-public/AB6AXuDthiMuddDRTgZBrpOuG8KuI5-W907hm4xkFE6_VmClh88MEi9I6F-yduoa0TkxuOkhCntQBctcKv4fi4Dwbg8CtxQnhRDT4K3_AKwJWpsudps_gQ1SOMEey5y5YYOcpJ4YYp0pUvcbSr2UQ4r0IVLbAXnwo14PZL4nExl8tsTM8BOzoRE-keeYcyuD7zZd93WxqkrADjVspketo8OCfZyw1uAfSUXR8jbFDsE3RcM4QuarKsMnAUk2"/>
</button>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow flex flex-col w-full max-w-container-max mx-auto px-margin-mobile md:px-margin-desktop pb-[100px] md:pb-12 pt-4">
<!-- Greeting Section -->
<section class="mb-6">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile md:font-display-lg md:text-display-lg text-primary">नमस्कार, Sita 👋</h1>
<p class="font-body-lg text-body-lg text-primary/80 mt-1">Let's get your products ready to sell.</p>
</section>
<!-- Main Action Bar (Speak & Create) -->
<section class="mb-6 cursor-pointer hover:opacity-90 transition-opacity shadow-sm">
<div class="w-full bg-madder-red text-on-madder-red p-6 rounded-2xl flex items-center gap-4">
<div class="w-14 h-14 bg-white/20 rounded-full flex items-center justify-center flex-shrink-0">
<span class="material-symbols-outlined filled-icon text-[32px]">mic</span>
</div>
<div>
<h2 class="font-headline-md text-headline-md font-bold">बोलकर Product बनाएं</h2>
<p class="font-body-md text-body-md text-on-madder-red/80">(Speak &amp; Create)</p>
</div>
</div>
</section>
<!-- Status Card -->
<section class="mb-8">
<div class="bg-surface rounded-2xl p-5 flex items-center justify-between shadow-sm">
<div class="flex items-center gap-4">
<div class="bg-primary/10 text-primary w-10 h-10 rounded-full flex items-center justify-center flex-shrink-0">
<span class="material-symbols-outlined filled-icon">check_circle</span>
</div>
<span class="font-body-lg text-body-lg text-primary font-medium">8 items saved in drafts</span>
</div>
<button class="font-label-lg text-label-lg text-primary font-bold px-4 py-2 hover:bg-primary/5 transition-colors rounded-lg flex-shrink-0 min-h-touch-target-min flex items-center justify-center">View</button>
</div>
</section>
<!-- List Layout (Quick Actions) -->
<section class="flex flex-col gap-4">
<!-- Add Product -->
<button class="bg-surface rounded-2xl p-6 flex items-center gap-5 shadow-sm hover:shadow-md transition-shadow">
<div class="w-14 h-14 bg-primary/10 rounded-full flex items-center justify-center text-primary flex-shrink-0">
<span class="material-symbols-outlined text-[32px]">add_a_photo</span>
</div>
<span class="font-label-lg text-label-lg text-primary font-bold text-xl">Add Product</span>
<span class="material-symbols-outlined text-primary ml-auto">chevron_right</span>
</button>
<!-- My Products -->
<button class="bg-surface rounded-2xl p-6 flex items-center gap-5 shadow-sm hover:shadow-md transition-shadow">
<div class="w-14 h-14 bg-primary/10 rounded-full flex items-center justify-center text-primary flex-shrink-0">
<span class="material-symbols-outlined text-[32px]">inventory_2</span>
</div>
<span class="font-label-lg text-label-lg text-primary font-bold text-xl">My Products</span>
<span class="material-symbols-outlined text-primary ml-auto">chevron_right</span>
</button>
<!-- Drafts -->
<button class="bg-surface rounded-2xl p-6 flex items-center gap-5 shadow-sm hover:shadow-md transition-shadow">
<div class="w-14 h-14 bg-primary/10 rounded-full flex items-center justify-center text-primary flex-shrink-0">
<span class="material-symbols-outlined text-[32px]">edit_document</span>
</div>
<span class="font-label-lg text-label-lg text-primary font-bold text-xl">Drafts</span>
<span class="material-symbols-outlined text-primary ml-auto">chevron_right</span>
</button>
<!-- Pricing -->
<button class="bg-surface rounded-2xl p-6 flex items-center gap-5 shadow-sm hover:shadow-md transition-shadow">
<div class="w-14 h-14 bg-primary/10 rounded-full flex items-center justify-center text-primary flex-shrink-0">
<span class="material-symbols-outlined text-[32px]">payments</span>
</div>
<span class="font-label-lg text-label-lg text-primary font-bold text-xl">Pricing</span>
<span class="material-symbols-outlined text-primary ml-auto">chevron_right</span>
</button>
</section>
</main>
<!-- BottomNavBar (Mobile Only) -->
<nav class="md:hidden fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-4 py-2 pb-safe border-t border-black/5 bg-surface h-[80px]">
<!-- Home (Active) -->
<button class="flex flex-col items-center justify-center text-primary rounded-full px-5 py-2 min-h-touch-target-min min-w-[64px]">
<span class="material-symbols-outlined filled-icon text-[28px]">home</span>
<span class="font-label-sm text-label-sm mt-1 font-bold">Home</span>
</button>
<!-- Products -->
<button class="flex flex-col items-center justify-center text-primary/60 px-4 py-2 hover:bg-black/5 transition-colors rounded-xl min-h-touch-target-min min-w-[64px]">
<span class="material-symbols-outlined text-[28px]">inventory_2</span>
<span class="font-label-sm text-label-sm mt-1">Products</span>
</button>
<!-- Orders -->
<button class="flex flex-col items-center justify-center text-primary/60 px-4 py-2 hover:bg-black/5 transition-colors rounded-xl min-h-touch-target-min min-w-[64px]">
<span class="material-symbols-outlined text-[28px]">shopping_bag</span>
<span class="font-label-sm text-label-sm mt-1">Orders</span>
</button>
<!-- Market -->
<button class="flex flex-col items-center justify-center text-primary/60 px-4 py-2 hover:bg-black/5 transition-colors rounded-xl min-h-touch-target-min min-w-[64px]">
<span class="material-symbols-outlined text-[28px]">storefront</span>
<span class="font-label-sm text-label-sm mt-1">Market</span>
</button>
<!-- Profile -->
<button class="flex flex-col items-center justify-center text-primary/60 px-4 py-2 hover:bg-black/5 transition-colors rounded-xl min-h-touch-target-min min-w-[64px]">
<span class="material-symbols-outlined text-[28px]">person</span>
<span class="font-label-sm text-label-sm mt-1">Profile</span>
</button>
</nav>
</body></html>
