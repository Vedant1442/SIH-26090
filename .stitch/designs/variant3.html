<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Artisan Connect - Home Dashboard</title>
<!-- Material Symbols -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400..700&amp;family=Manrope:wght@400..800&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Tailwind Config -->
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "indigo-deep": "#1A237E",
                    "madder-red": "#B71C1C",
                    "cream": "#FFF8EE",
                    "on-primary-fixed": "#3c0800",
                    "background": "#FFF8EE",
                    "tertiary": "#833828",
                    "on-primary": "#ffffff",
                    "primary-fixed": "#ffdad2",
                    "on-background": "#1A237E",
                    "on-error-container": "#93000a",
                    "on-tertiary-fixed-variant": "#783020",
                    "inverse-on-surface": "#ffede7",
                    "surface": "#FFF8EE",
                    "on-surface": "#1A237E",
                    "on-tertiary-fixed": "#3e0500",
                    "tertiary-fixed": "#ffdad3",
                    "inverse-primary": "#ffb4a2",
                    "surface-container-lowest": "#ffffff",
                    "primary": "#1A237E",
                    "on-primary-fixed-variant": "#7e2b16",
                    "secondary-fixed": "#ffdeae",
                    "tertiary-fixed-dim": "#ffb4a4",
                    "error": "#ba1a1a",
                    "on-tertiary": "#ffffff",
                    "surface-container-low": "#fff1ec",
                    "primary-fixed-dim": "#ffb4a2",
                    "primary-container": "#1A237E",
                    "on-secondary-container": "#724d00",
                    "inverse-surface": "#3b2e28",
                    "surface-container": "#f0e7da",
                    "surface-container-high": "#e6dcd0",
                    "outline-variant": "#dcc0ba",
                    "on-surface-variant": "#4a5568",
                    "surface-container-highest": "#f4ded6",
                    "on-secondary-fixed": "#281800",
                    "on-secondary": "#ffffff",
                    "outline": "#1A237E",
                    "surface-tint": "#9d422b",
                    "tertiary-container": "#a14f3d",
                    "surface-bright": "#fff8f6",
                    "error-container": "#ffdad6",
                    "on-tertiary-container": "#ffdfd9",
                    "surface-variant": "#f4ded6",
                    "secondary": "#B71C1C",
                    "on-primary-container": "#ffffff",
                    "secondary-fixed-dim": "#fcbb4c",
                    "on-error": "#ffffff",
                    "surface-dim": "#ebd6cd",
                    "on-secondary-fixed-variant": "#604100",
                    "secondary-container": "#ffbe4f"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "2xl": "1.25rem",
                    "full": "9999px"
            },
            "spacing": {
                    "margin-desktop": "40px",
                    "gutter": "24px",
                    "margin-mobile": "16px",
                    "container-max": "1280px",
                    "touch-target-min": "48px",
                    "unit": "8px"
            },
            "fontFamily": {
                    "label-sm": ["Inter"],
                    "body-lg": ["Inter"],
                    "headline-md": ["Manrope"],
                    "headline-lg": ["Manrope"],
                    "display-lg": ["Manrope"],
                    "body-md": ["Inter"],
                    "label-lg": ["Inter"],
                    "headline-lg-mobile": ["Manrope"]
            },
            "fontSize": {
                    "label-sm": ["12px", {"lineHeight": "16px", "fontWeight": "500"}],
                    "body-lg": ["18px", {"lineHeight": "28px", "fontWeight": "400"}],
                    "headline-md": ["24px", {"lineHeight": "32px", "fontWeight": "800"}],
                    "headline-lg": ["32px", {"lineHeight": "40px", "fontWeight": "800"}],
                    "display-lg": ["48px", {"lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "800"}],
                    "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                    "label-lg": ["14px", {"lineHeight": "20px", "letterSpacing": "0.01em", "fontWeight": "700"}],
                    "headline-lg-mobile": ["28px", {"lineHeight": "36px", "fontWeight": "800"}]
            }
          }
        }
      }
    </script>
<style>
        .material-symbols-outlined {
          font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .filled-icon {
          font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="bg-cream text-indigo-deep font-body-md antialiased min-h-screen flex flex-col">
<!-- TopAppBar -->
<header class="flex justify-between items-center w-full px-margin-mobile md:px-margin-desktop py-4 bg-cream/90 backdrop-blur docked full-width top-0 z-40 sticky">
<div class="font-headline-md text-headline-md font-extrabold text-indigo-deep tracking-tight">Artisan Connect</div>
<div class="flex items-center gap-4">
<button aria-label="Notifications" class="w-12 h-12 flex items-center justify-center rounded-full hover:bg-surface-container transition-colors">
<span class="material-symbols-outlined text-indigo-deep text-[28px]">notifications</span>
</button>
<button class="hover:opacity-80 transition-opacity">
<img alt="User Profile Avatar" class="w-10 h-10 rounded-full object-cover border-2 border-indigo-deep" data-alt="A close-up portrait of an Indian woman, a master weaver, in her mid-40s with a warm, welcoming smile. She is wearing a simple, elegant earthy-toned sari. The lighting is soft, natural, and flattering, reflecting a high-end, authentic lifestyle photography style suitable for a premium marketplace profile picture. The background is slightly blurred but suggests a bright, organized workshop." src="https://lh3.googleusercontent.com/aida-public/AB6AXuDthiMuddDRTgZBrpOuG8KuI5-W907hm4xkFE6_VmClh88MEi9I6F-yduoa0TkxuOkhCntQBctcKv4fi4Dwbg8CtxQnhRDT4K3_AKwJWpsudps_gQ1SOMEey5y5YYOcpJ4YYp0pUvcbSr2UQ4r0IVLbAXnwo14PZL4nExl8tsTM8BOzoRE-keeYcyuD7zZd93WxqkrADjVspketo8OCfZyw1uAfSUXR8jbFDsE3RcM4QuarKsMnAUk2"/>
</button>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow flex flex-col w-full max-w-container-max mx-auto px-margin-mobile md:px-margin-desktop pb-[100px] md:pb-12 pt-4">
<!-- Main Content Area: Large Welcoming Card -->
<section class="mb-16 relative">
<div class="bg-indigo-deep text-white p-8 md:p-12 rounded-[24px] shadow-2xl w-full min-h-[220px] flex flex-col justify-center">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile md:font-display-lg md:text-display-lg font-extrabold">नमस्कार, Sita 👋</h1>
<p class="font-body-lg text-body-lg text-white/80 mt-2">Let's get your products ready to sell.</p>
</div>
<!-- Floating Action: Voice Mic -->
<div class="absolute -bottom-8 right-6 md:right-12 flex items-center gap-4">
<div class="text-indigo-deep font-headline-md font-bold text-right hidden md:block">
    बोलकर Product बनाएं<br/><span class="text-sm font-medium opacity-80">(Speak &amp; Create)</span>
</div>
<button class="w-20 h-20 md:w-24 md:h-24 bg-madder-red rounded-full text-white shadow-[0_12px_30px_rgba(183,28,28,0.4)] flex items-center justify-center hover:scale-105 hover:-translate-y-1 transition-all duration-300 z-10 group">
<span class="material-symbols-outlined filled-icon text-[40px] md:text-[48px] group-hover:scale-110 transition-transform">mic</span>
</button>
</div>
<div class="text-indigo-deep font-headline-md font-bold text-right mt-10 md:hidden pr-4">
    बोलकर Product बनाएं <span class="text-sm font-medium opacity-80 block">(Speak &amp; Create)</span>
</div>
</section>
<!-- Status Card -->
<section class="mb-8 mt-4">
<div class="bg-cream border-2 border-indigo-deep rounded-[20px] p-5 flex items-center gap-4 shadow-sm">
<div class="bg-indigo-deep text-white w-10 h-10 rounded-full flex items-center justify-center flex-shrink-0">
<span class="material-symbols-outlined filled-icon">check_circle</span>
</div>
<div class="flex-grow">
<span class="font-body-md text-body-md text-indigo-deep font-bold block">8 items saved in drafts</span>
</div>
<button class="font-label-lg text-label-lg text-white bg-indigo-deep font-bold px-6 py-2 hover:bg-indigo-deep/90 transition-colors rounded-xl flex-shrink-0 min-h-touch-target-min flex items-center justify-center">View</button>
</div>
</section>
<!-- 2x2 Grid (Quick Actions) -->
<section class="grid grid-cols-2 md:grid-cols-4 gap-4 md:gap-6">
<!-- Add Product -->
<button class="bg-indigo-deep text-white border-2 border-indigo-deep rounded-[20px] p-6 flex flex-col items-center justify-center gap-3 min-h-[140px] shadow-lg hover:-translate-y-1 transition-all duration-200">
<div class="w-12 h-12 bg-white/10 rounded-full flex items-center justify-center text-white mb-1">
<span class="material-symbols-outlined text-[32px]">add_a_photo</span>
</div>
<span class="font-label-lg text-label-lg font-bold">Add Product</span>
</button>
<!-- My Products -->
<button class="bg-cream border-2 border-indigo-deep rounded-[20px] p-6 flex flex-col items-center justify-center gap-3 min-h-[140px] hover:shadow-lg hover:bg-indigo-deep/5 hover:-translate-y-1 transition-all duration-200 group">
<div class="w-12 h-12 bg-indigo-deep/10 rounded-full flex items-center justify-center text-indigo-deep mb-1 group-hover:bg-indigo-deep group-hover:text-white transition-colors">
<span class="material-symbols-outlined text-[32px]">inventory_2</span>
</div>
<span class="font-label-lg text-label-lg text-indigo-deep font-bold">My Products</span>
</button>
<!-- Drafts -->
<button class="bg-cream border-2 border-indigo-deep rounded-[20px] p-6 flex flex-col items-center justify-center gap-3 min-h-[140px] hover:shadow-lg hover:bg-indigo-deep/5 hover:-translate-y-1 transition-all duration-200 group">
<div class="w-12 h-12 bg-indigo-deep/10 rounded-full flex items-center justify-center text-indigo-deep mb-1 group-hover:bg-indigo-deep group-hover:text-white transition-colors">
<span class="material-symbols-outlined text-[32px]">edit_document</span>
</div>
<span class="font-label-lg text-label-lg text-indigo-deep font-bold">Drafts</span>
</button>
<!-- Pricing -->
<button class="bg-cream border-2 border-indigo-deep rounded-[20px] p-6 flex flex-col items-center justify-center gap-3 min-h-[140px] hover:shadow-lg hover:bg-indigo-deep/5 hover:-translate-y-1 transition-all duration-200 group">
<div class="w-12 h-12 bg-indigo-deep/10 rounded-full flex items-center justify-center text-indigo-deep mb-1 group-hover:bg-indigo-deep group-hover:text-white transition-colors">
<span class="material-symbols-outlined text-[32px]">payments</span>
</div>
<span class="font-label-lg text-label-lg text-indigo-deep font-bold">Pricing</span>
</button>
</section>
</main>
<!-- BottomNavBar (Mobile Only) -->
<nav class="md:hidden fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-4 py-2 pb-safe border-t-2 border-indigo-deep/10 bg-cream shadow-xl h-[80px]">
<!-- Home (Active) -->
<button class="flex flex-col items-center justify-center bg-indigo-deep text-white rounded-2xl px-5 py-2 scale-95 min-h-touch-target-min min-w-[64px]">
<span class="material-symbols-outlined filled-icon">home</span>
<span class="font-label-sm text-label-sm mt-1 font-bold">Home</span>
</button>
<!-- Products -->
<button class="flex flex-col items-center justify-center text-indigo-deep/70 px-4 py-2 hover:text-indigo-deep transition-colors rounded-xl min-h-touch-target-min min-w-[64px]">
<span class="material-symbols-outlined">inventory_2</span>
<span class="font-label-sm text-label-sm mt-1 font-bold">Products</span>
</button>
<!-- Orders -->
<button class="flex flex-col items-center justify-center text-indigo-deep/70 px-4 py-2 hover:text-indigo-deep transition-colors rounded-xl min-h-touch-target-min min-w-[64px]">
<span class="material-symbols-outlined">shopping_bag</span>
<span class="font-label-sm text-label-sm mt-1 font-bold">Orders</span>
</button>
<!-- Market -->
<button class="flex flex-col items-center justify-center text-indigo-deep/70 px-4 py-2 hover:text-indigo-deep transition-colors rounded-xl min-h-touch-target-min min-w-[64px]">
<span class="material-symbols-outlined">storefront</span>
<span class="font-label-sm text-label-sm mt-1 font-bold">Market</span>
</button>
<!-- Profile -->
<button class="flex flex-col items-center justify-center text-indigo-deep/70 px-4 py-2 hover:text-indigo-deep transition-colors rounded-xl min-h-touch-target-min min-w-[64px]">
<span class="material-symbols-outlined">person</span>
<span class="font-label-sm text-label-sm mt-1 font-bold">Profile</span>
</button>
</nav>
</body></html>
