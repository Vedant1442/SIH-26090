<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>

                        "on-tertiary-container": "#d39f3c",

                        "outline": "#74777d",

                        "error-container": "#ffdad6",
                        "background": "#fef9ef",

                        "surface-container": "#f2ede3",

                    "spacing": {
                        "touch-target": "48px",
                        "margin-desktop": "40px",
                        "thread-gap": "4px",
                        "margin-mobile": "16px",
                        "gutter": "24px",
                        "unit": "8px"
                    },
                    "fontFamily": {
                        "headline-lg-mobile": ["Fraunces"],
                        "display-lg": ["Fraunces"],
                        "body-md": ["Manrope"],
                        "label-sm": ["Manrope"],

                    "fontSize": {
                        "headline-lg-mobile": ["28px", { "lineHeight": "36px", "fontWeight": "600" }],

<style>
        .thread-row {
            background-image: repeating-linear-gradient(to right, #8A8F94 0, #8A8F94 12px, transparent 12px, transparent 16px);
            background-position: bottom;
            background-repeat: repeat-x;
            background-size: 16px 4px;
            height: 4px;
            width: 100%;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-kora-cotton text-on-surface min-h-screen flex flex-col font-body-md">
<!-- TopAppBar -->
<header class="w-full top-0 sticky z-40 bg-kora-cotton dark:bg-surface-variant flex justify-between items-center px-margin-mobile md:px-margin-desktop h-14 w-full shadow-sm dark:shadow-none">
<button aria-label="Menu" class="w-touch-target h-touch-target flex items-center justify-center text-primary dark:text-primary-fixed-dim hover:bg-surface-dim transition-colors active:scale-95 duration-200 rounded-full">
<span class="material-symbols-outlined" data-icon="menu">menu</span>
</button>
<h1 class="font-headline-md text-headline-md-mobile md:font-headline-md md:text-headline-md text-primary dark:text-primary-fixed-dim font-bold tracking-tight">Kaarigar Setu</h1>
<button aria-label="Notifications" class="w-touch-target h-touch-target flex items-center justify-center text-primary dark:text-primary-fixed-dim hover:bg-surface-dim transition-colors active:scale-95 duration-200 rounded-full">
<span class="material-symbols-outlined" data-icon="notifications">notifications</span>
</button>
</header>
<!-- Main Content Canvas -->
<main class="flex-1 px-margin-mobile md:px-margin-desktop py-8 pb-32 max-w-[1280px] mx-auto w-full flex flex-col gap-8">
<!-- Top Section: Greeting & Status -->
<section class="flex flex-col gap-2">
<h2 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg text-kattha-ink">नमस्कार, Sita 👋</h2>
<p class="font-body-md text-body-md text-slate-mist">3 products live, 1 needs your voice</p>
</section>
<!-- Main Area: Dominant Card -->
<section class="flex-1 flex flex-col gap-8">
<button class="w-full rounded-[20px] bg-indigo-deep text-on-primary p-8 flex flex-col items-center justify-center gap-6 min-h-[300px] shadow-[0_4px_24px_rgba(44,62,82,0.15)] active:bg-surface-dim active:scale-[0.98] transition-all duration-200 outline outline-1 outline-slate-mist/20 focus:outline-none focus:ring-2 focus:ring-madder-red">
<div class="flex gap-6 items-center">
<div class="w-16 h-16 rounded-full bg-madder-red flex items-center justify-center shadow-[0_8px_32px_rgba(168,67,47,0.3)]">
<span class="material-symbols-outlined text-3xl" data-icon="mic" data-weight="fill" style="font-variation-settings: 'FILL' 1;">mic</span>
</div>
<div class="w-16 h-16 rounded-full bg-surface-tint/20 flex items-center justify-center backdrop-blur-sm border border-white/10">
<span class="material-symbols-outlined text-3xl" data-icon="photo_camera">photo_camera</span>
</div>
</div>
<div class="flex flex-col items-center gap-2">
<h3 class="font-headline-md text-headline-md-mobile md:font-headline-md md:text-headline-md">Add a product</h3>
<p class="font-body-md text-body-md text-primary-fixed-dim">Tap to start listing</p>
</div>
</button>
<!-- Thread Motif -->
<div aria-hidden="true" class="thread-row opacity-60 my-2"></div>
<!-- Progress Indicator -->
<div class="flex items-center justify-between p-4 bg-surface-bright rounded-xl outline outline-1 outline-slate-mist/20">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-turmeric" data-icon="pending_actions">pending_actions</span>
<span class="font-label-lg text-label-lg text-kattha-ink">2 of 5 documents ready</span>
</div>
<button class="font-label-sm text-label-sm text-madder-red uppercase tracking-wider hover:underline active:opacity-70 transition-opacity p-2 -m-2">Complete</button>
</div>
</section>
</main>
<!-- BottomNavBar -->
<nav class="md:hidden fixed bottom-0 left-0 w-full z-50 bg-kora-cotton dark:bg-surface-variant border-t-thread border-outline-variant/20 shadow-sm dark:shadow-none pb-safe">
<div class="flex justify-around items-center h-touch-target px-2 w-full">
<!-- Home (Active) -->
<button aria-current="page" aria-label="Home" class="flex flex-col items-center justify-center bg-primary-container text-on-primary-container rounded-xl px-4 py-1.5 active:scale-90 transition-transform duration-150">
<span class="material-symbols-outlined" data-icon="home" data-weight="fill" style="font-variation-settings: 'FILL' 1;">home</span>
<span class="font-label-sm text-label-sm mt-1">Home</span>
</button>
<!-- Speak (Inactive) -->
<button aria-label="Speak" class="flex flex-col items-center justify-center text-on-surface-variant p-2 hover:text-primary dark:hover:text-primary-fixed-dim active:scale-90 transition-transform duration-150">
<span class="material-symbols-outlined" data-icon="mic">mic</span>
<span class="font-label-sm text-label-sm mt-1">Speak</span>
</button>
<!-- Photo (Inactive) -->
<button aria-label="Photo" class="flex flex-col items-center justify-center text-on-surface-variant p-2 hover:text-primary dark:hover:text-primary-fixed-dim active:scale-90 transition-transform duration-150">
<span class="material-symbols-outlined" data-icon="photo_camera">photo_camera</span>
<span class="font-label-sm text-label-sm mt-1">Photo</span>
</button>
<!-- My Products (Inactive) -->
<button aria-label="My Products" class="flex flex-col items-center justify-center text-on-surface-variant p-2 hover:text-primary dark:hover:text-primary-fixed-dim active:scale-90 transition-transform duration-150">
<span class="material-symbols-outlined" data-icon="inventory_2">inventory_2</span>
<span class="font-label-sm text-label-sm mt-1 text-center leading-tight">My Products</span>
</button>
</div>
</nav>
<!-- Desktop Nav Fallback (Optional layout cue, hidden on mobile) -->
<div class="hidden md:flex fixed left-0 top-14 bottom-0 w-64 bg-surface-bright border-r border-slate-mist/20 p-6 flex-col gap-2 z-30">
<div class="font-label-sm text-label-sm text-slate-mist uppercase tracking-widest mb-4">Navigation</div>
<!-- Home (Active) -->
<button aria-current="page" aria-label="Home" class="flex items-center gap-4 bg-primary-container text-on-primary-container rounded-xl px-4 py-3 active:scale-95 transition-transform duration-150 w-full text-left">
<span class="material-symbols-outlined" data-icon="home" data-weight="fill" style="font-variation-settings: 'FILL' 1;">home</span>
<span class="font-body-md text-body-md font-medium">Home</span>
</button>
<!-- Speak (Inactive) -->
<button aria-label="Speak" class="flex items-center gap-4 text-on-surface-variant p-3 hover:bg-surface-dim rounded-xl active:scale-95 transition-transform duration-150 w-full text-left">
<span class="material-symbols-outlined" data-icon="mic">mic</span>
<span class="font-body-md text-body-md font-medium">Speak</span>
</button>
<!-- Photo (Inactive) -->
<button aria-label="Photo" class="flex items-center gap-4 text-on-surface-variant p-3 hover:bg-surface-dim rounded-xl active:scale-95 transition-transform duration-150 w-full text-left">
<span class="material-symbols-outlined" data-icon="photo_camera">photo_camera</span>
<span class="font-body-md text-body-md font-medium">Photo</span>
</button>
<!-- My Products (Inactive) -->
<button aria-label="My Products" class="flex items-center gap-4 text-on-surface-variant p-3 hover:bg-surface-dim rounded-xl active:scale-95 transition-transform duration-150 w-full text-left">
<span class="material-symbols-outlined" data-icon="inventory_2">inventory_2</span>
<span class="font-body-md text-body-md font-medium">My Products</span>
</button>
</div>
</body></html>
