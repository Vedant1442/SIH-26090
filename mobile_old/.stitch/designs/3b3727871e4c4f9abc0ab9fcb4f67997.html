<style>
        .material-symbols-outlined {
          font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .filled-icon {
          font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>

<body class="bg-surface text-on-surface font-body-md antialiased min-h-screen flex flex-col">
<!-- TopAppBar -->
<header class="flex justify-between items-center w-full px-margin-mobile md:px-margin-desktop py-4 bg-surface docked full-width top-0 z-40 sticky">
<div class="font-headline-md text-headline-md font-bold text-primary">Artisan Connect</div>
<div class="flex items-center gap-4">
<button aria-label="Notifications" class="w-12 h-12 flex items-center justify-center rounded-full hover:bg-surface-container-high transition-colors">
<span class="material-symbols-outlined text-primary text-[28px]">notifications</span>
</button>
<button class="hover:opacity-80 transition-opacity">
<img alt="User Profile Avatar" class="w-10 h-10 rounded-full object-cover border border-outline-variant/30" data-alt="A close-up portrait of an Indian woman, a master weaver, in her mid-40s with a warm, welcoming smile. She is wearing a simple, elegant earthy-toned sari. The lighting is soft, natural, and flattering, reflecting a high-end, authentic lifestyle photography style suitable for a premium marketplace profile picture. The background is slightly blurred but suggests a bright, organized workshop." src="https://lh3.googleusercontent.com/aida-public/AB6AXuDthiMuddDRTgZBrpOuG8KuI5-W907hm4xkFE6_VmClh88MEi9I6F-yduoa0TkxuOkhCntQBctcKv4fi4Dwbg8CtxQnhRDT4K3_AKwJWpsudps_gQ1SOMEey5y5YYOcpJ4YYp0pUvcbSr2UQ4r0IVLbAXnwo14PZL4nExl8tsTM8BOzoRE-keeYcyuD7zZd93WxqkrADjVspketo8OCfZyw1uAfSUXR8jbFDsE3RcM4QuarKsMnAUk2"/>
</button>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow flex flex-col w-full max-w-container-max mx-auto px-margin-mobile md:px-margin-desktop pb-[100px] md:pb-12 pt-4">
<!-- Greeting Section -->
<section class="mb-8">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile md:font-display-lg md:text-display-lg text-on-surface">नमस्कार, Sita 👋</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant mt-2">Let's get your products ready to sell.</p>
</section>
<!-- Main Action Card (Speak & Create) -->
<section class="mb-6 relative overflow-hidden rounded-xl shadow-[0_8px_30px_rgba(45,33,28,0.08)] group cursor-pointer hover:shadow-[0_12px_40px_rgba(45,33,28,0.12)] transition-shadow duration-300">
<div class="absolute inset-0 bg-cover bg-center opacity-20 mix-blend-overlay" data-alt="An abstract, subtle background texture representing soundwaves and creativity. The image should feature a very soft, warm terracotta and cream color palette with fluid, organic wave lines gently cascading across the frame. It should evoke a sense of modern AI technology seamlessly blending with natural, artisanal warmth. High key, minimalist aesthetic." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuDrKX6rbDYLyl6Gm-6mPYTZRBaXREy7MIyrf8XHX78j80KevaSkgrXUKFi9VzIlKVu7sesDlCVM76P-g0aJ2R7Rx_3LBvt-zMOYo9dTDSpTvQbDzl-9LPxSyD_UI-4K8MwnVGr3abCiwvKSVwxetnuQeNWX99278FtJTeq-pPoJBGOM9CQ6nYgMttVbIohtRB04Rjgk0xllVj93SPlMUAUXL8mG9HvMRDTqKYp1_aOqFKDwYVHXuQz0')"></div>
<div class="relative w-full bg-primary text-on-primary p-8 md:p-12 flex flex-col items-center justify-center gap-4 text-center min-h-[200px]">
<div class="w-16 h-16 bg-on-primary/20 rounded-full flex items-center justify-center mb-2 group-hover:scale-110 transition-transform duration-300">
<span class="material-symbols-outlined filled-icon text-[36px]">mic</span>
</div>
<h2 class="font-headline-md text-headline-md md:font-headline-lg md:text-headline-lg font-bold">🎙 बोलकर Product बनाएं</h2>
<p class="font-body-lg text-body-lg text-primary-fixed-dim">(Speak & Create)</p>
</div>
</section>
<!-- Status Card -->
<section class="mb-8">
<div class="bg-surface-container-lowest border border-outline-variant/20 rounded-lg p-4 flex items-center gap-4 shadow-[0_4px_20px_rgba(45,33,28,0.04)]">
<div class="bg-surface-container text-primary w-10 h-10 rounded-full flex items-center justify-center flex-shrink-0">
<span class="material-symbols-outlined filled-icon">check_circle</span>
</div>
<div class="flex-grow">
<span class="font-body-md text-body-md text-on-surface font-medium block">8 items saved in drafts</span>
</div>
<button class="font-label-lg text-label-lg text-primary font-bold px-4 py-2 hover:bg-surface-container transition-colors rounded-lg flex-shrink-0 min-h-touch-target-min flex items-center justify-center">View</button>
</div>
</section>
<!-- 2x2 Grid (Quick Actions) -->
<section class="grid grid-cols-2 md:grid-cols-4 gap-4 md:gap-6">
<!-- Add Product -->
<button class="bg-surface-container-lowest border border-outline-variant/10 rounded-xl p-6 flex flex-col items-center justify-center gap-3 min-h-[140px] shadow-[0_4px_20px_rgba(45,33,28,0.04)] hover:shadow-[0_8px_30px_rgba(45,33,28,0.08)] hover:-translate-y-1 transition-all duration-200">
<div class="w-12 h-12 bg-surface-container-high rounded-full flex items-center justify-center text-primary mb-1">
<span class="material-symbols-outlined text-[28px]">add_a_photo</span>
</div>
<span class="font-label-lg text-label-lg text-on-surface font-semibold">Add Product</span>
</button>
<!-- My Products -->
<button class="bg-surface-container-lowest border border-outline-variant/10 rounded-xl p-6 flex flex-col items-center justify-center gap-3 min-h-[140px] shadow-[0_4px_20px_rgba(45,33,28,0.04)] hover:shadow-[0_8px_30px_rgba(45,33,28,0.08)] hover:-translate-y-1 transition-all duration-200">
<div class="w-12 h-12 bg-surface-container-high rounded-full flex items-center justify-center text-primary mb-1">
<span class="material-symbols-outlined text-[28px]">inventory_2</span>
</div>
<span class="font-label-lg text-label-lg text-on-surface font-semibold">My Products</span>
</button>
<!-- Drafts -->
<button class="bg-surface-container-lowest border border-outline-variant/10 rounded-xl p-6 flex flex-col items-center justify-center gap-3 min-h-[140px] shadow-[0_4px_20px_rgba(45,33,28,0.04)] hover:shadow-[0_8px_30px_rgba(45,33,28,0.08)] hover:-translate-y-1 transition-all duration-200">
<div class="w-12 h-12 bg-surface-container-high rounded-full flex items-center justify-center text-primary mb-1">
<span class="material-symbols-outlined text-[28px]">edit_document</span>
</div>
<span class="font-label-lg text-label-lg text-on-surface font-semibold">Drafts</span>
</button>
<!-- Pricing -->
<button class="bg-surface-container-lowest border border-outline-variant/10 rounded-xl p-6 flex flex-col items-center justify-center gap-3 min-h-[140px] shadow-[0_4px_20px_rgba(45,33,28,0.04)] hover:shadow-[0_8px_30px_rgba(45,33,28,0.08)] hover:-translate-y-1 transition-all duration-200">
<div class="w-12 h-12 bg-surface-container-high rounded-full flex items-center justify-center text-primary mb-1">
<span class="material-symbols-outlined text-[28px]">payments</span>
</div>
<span class="font-label-lg text-label-lg text-on-surface font-semibold">Pricing</span>
</button>
</section>
</main>
<!-- BottomNavBar (Mobile Only) -->
<nav class="md:hidden fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-4 py-2 pb-safe border-t border-outline-variant/10 bg-surface shadow-[0_-4px_20px_rgba(45,33,28,0.04)] rounded-t-xl h-[80px]">
<!-- Home (Active) -->
<button class="flex flex-col items-center justify-center bg-primary-container text-on-primary-container rounded-full px-5 py-2 scale-90 duration-200 min-h-touch-target-min min-w-[64px]">
<span class="material-symbols-outlined filled-icon">home</span>
<span class="font-label-sm text-label-sm mt-1">Home</span>
</button>
<!-- Products -->
<button class="flex flex-col items-center justify-center text-on-surface-variant px-4 py-2 hover:bg-surface-container-high transition-colors rounded-xl min-h-touch-target-min min-w-[64px]">
<span class="material-symbols-outlined">inventory_2</span>
<span class="font-label-sm text-label-sm mt-1">Products</span>
</button>
<!-- Orders -->
<button class="flex flex-col items-center justify-center text-on-surface-variant px-4 py-2 hover:bg-surface-container-high transition-colors rounded-xl min-h-touch-target-min min-w-[64px]">
<span class="material-symbols-outlined">shopping_bag</span>
<span class="font-label-sm text-label-sm mt-1">Orders</span>
</button>
<!-- Market -->
<button class="flex flex-col items-center justify-center text-on-surface-variant px-4 py-2 hover:bg-surface-container-high transition-colors rounded-xl min-h-touch-target-min min-w-[64px]">
<span class="material-symbols-outlined">storefront</span>
<span class="font-label-sm text-label-sm mt-1">Market</span>
</button>
<!-- Profile -->
<button class="flex flex-col items-center justify-center text-on-surface-variant px-4 py-2 hover:bg-surface-container-high transition-colors rounded-xl min-h-touch-target-min min-w-[64px]">
<span class="material-symbols-outlined">person</span>
<span class="font-label-sm text-label-sm mt-1">Profile</span>
</button>
</nav>
</body></html>
