<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>AI Pricing Assistant - Artisan Connect</title>

                        "primary": "#89331d",
                        "on-primary-fixed-variant": "#7e2b16",
                        "secondary-fixed": "#ffdeae",
                        "tertiary-fixed-dim": "#ffb4a4",

                        "on-primary-container": "#ffdfd7",
                        "secondary-fixed-dim": "#fcbb4c",

                        "surface-dim": "#ebd6cd",

    body {
      min-height: max(884px, 100dvh);
    }

<body class="bg-background text-on-background min-h-screen flex flex-col font-body-md antialiased">
<!-- Main Content Canvas - Focused Journey, Nav Suppressed -->
<main class="flex-grow flex flex-col items-center justify-center p-margin-mobile md:p-margin-desktop">
<div class="w-full max-w-md bg-surface-container-lowest rounded-2xl shadow-[0_8px_30px_rgba(45,33,28,0.08)] border border-outline/10 p-6 md:p-8 flex flex-col items-center relative overflow-hidden">
<!-- AI Accent Border -->
<div class="absolute top-0 left-0 w-full h-1 bg-secondary-container"></div>
<!-- Header -->
<div class="flex flex-col items-center mb-8 text-center">
<div class="bg-secondary-container/20 p-3 rounded-full mb-4">
<span class="material-symbols-outlined text-secondary text-3xl" style="font-variation-settings: 'FILL' 1;">
                        auto_awesome
                    </span>
</div>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg text-on-surface mb-2">Suggested Price</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Based on market trends and fair wage standards.</p>
</div>
<!-- Price Display -->
<div class="flex flex-col items-center mb-8 w-full">
<div class="font-display-lg text-display-lg text-primary mb-2">₹499</div>
<div class="bg-surface-container-low px-4 py-2 rounded-full border border-outline-variant/30">
<span class="font-label-sm text-label-sm text-on-surface-variant">Recommended range ₹450 – ₹550</span>
</div>
</div>
<!-- Breakdown -->
<div class="w-full bg-surface-container rounded-xl p-5 mb-8 border border-outline-variant/20">
<h3 class="font-label-lg text-label-lg text-on-surface mb-4 border-b border-outline-variant/20 pb-2">Price Breakdown</h3>
<ul class="space-y-3">
<li class="flex justify-between items-center font-body-md text-body-md text-on-surface-variant">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-[18px]">inventory</span>
<span>Material cost</span>
</div>
<span class="font-label-lg text-label-lg text-on-surface">₹180</span>
</li>
<li class="flex justify-between items-center font-body-md text-body-md text-on-surface-variant">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-[18px]">engineering</span>
<span>Fair labour</span>
</div>
<span class="font-label-lg text-label-lg text-on-surface">₹200</span>
</li>
<li class="flex justify-between items-center font-body-md text-body-md text-on-surface-variant pt-2 border-t border-outline-variant/20">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-[18px]">storefront</span>
<span>Similar products</span>
</div>
<span class="font-label-lg text-label-lg text-on-surface">₹450</span>
</li>
</ul>
</div>
<!-- Actions -->
<div class="w-full flex flex-col gap-3 mb-6">
<button class="w-full h-touch-target-min bg-primary text-on-primary font-label-lg text-label-lg rounded-full flex items-center justify-center gap-2 hover:bg-primary-container transition-colors shadow-sm">
<span class="material-symbols-outlined text-[20px]">check</span>
                    Accept ₹499
                </button>
<button class="w-full h-touch-target-min border-2 border-primary text-primary font-label-lg text-label-lg rounded-full flex items-center justify-center hover:bg-primary-fixed/20 transition-colors">
                    Change Price
                </button>
</div>
<!-- Footer Link -->
<a class="font-label-lg text-label-lg text-secondary hover:text-secondary-fixed-dim transition-colors flex items-center gap-1" href="#">
<span class="material-symbols-outlined text-[16px]">info</span>
                Why ₹499?
            </a>
</div>
</main>
</body></html>
